<body><header><div class="w"><a href="/">AVA <i>Connect</i></a></div></header><div class="w"><main><h1>Exclusão de dados</h1><p class="m">Última atualização: 24 de novembro de 2026</p>
<p>Você pode pedir a exclusão dos seus dados tratados pelo AVA Connect (AVA Talk, AVA Manager e AVA Ponto), da AVANTTE ASSESSORIA EMPRESARIAL LTDA, CNPJ 62.699.610/0001-82.</p>
<h2>Se você é cliente do AVA Connect (empresa)</h2><ol><li>Envie um e-mail para <a href="mailto:contato@grupoavantte.com.br?subject=Exclus%C3%A3o%20de%20dados">contato@grupoavantte.com.br</a> com o assunto "Exclusão de dados", a partir do e-mail cadastrado na conta, informando o nome da empresa e o CNPJ.</li>
<li>Confirmamos o pedido em até 2 dias úteis.</li><li>Excluímos a conta, as conversas, os contatos, o CRM e os arquivos em até 15 dias, exceto o que a lei nos obriga a guardar (por exemplo, notas fiscais e registros de pagamento), e avisamos por e-mail quando terminar.</li></ol>
<h2>Se você conversou com uma empresa atendida pela AVA</h2><p>As conversas pertencem à empresa com quem você falou, que é a responsável pelos seus dados. Peça a exclusão diretamente a ela. Se preferir, escreva para <a href="mailto:contato@grupoavantte.com.br?subject=Exclus%C3%A3o%20de%20dados">contato@grupoavantte.com.br</a> informando o número de WhatsApp ou o e-mail usado e o nome da empresa: encaminhamos o pedido e ajudamos a empresa a atendê-lo.</p>
<h2>Se você entrou com o Facebook</h2><p>Você também pode remover o acesso do AVA Connect em Configurações e privacidade › Configurações › Integrações comerciais, no Facebook. Depois disso, peça a exclusão dos dados pelo e-mail acima.</p>
<p class="m">Mais detalhes na <a href="/privacidade">Política de privacidade</a>.</p></main></div></body></html>
