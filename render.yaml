services:
  - type: web
    name: ava-connect
    runtime: node
    plan: starter
    region: virginia
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_PATH
        value: /var/data/ava-connect.db
      - key: ADMIN_TOKEN
        generateValue: true
      - key: WA_VERIFY_TOKEN
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: vendas@grupoavantte.com.br
      - key: PLATAFORMA_EMAIL
        value: contato@grupoavantte.com.br
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_ES_CONFIG_ID
        sync: false
      - key: TRANSCRICAO_API_KEY
        sync: false
    disk:
      name: ava-data
      mountPath: /var/data
      sizeGB: 1
